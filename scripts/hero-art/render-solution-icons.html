<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>

<script type="module">
/*
 * Acestar solution-card visuals. Each object is rendered twice (black and white backdrop) and the
 * pair is difference-matted into a PNG with real transparency, so the glass shows the card colour
 * behind it in both light and dark themes.  ?icon=ai|creative|doc|laptop&s=800
 */
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const q = new URLSearchParams(location.search);
const S = +q.get("s") || 800;
const icon = q.get("icon") || "ai";

await new FontFace("Inter", "url(./assets/inter.woff2)", { weight: "100 900" }).load().then((f) => document.fonts.add(f));

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
cam.position.set(0, 0, 10);

const l1 = new THREE.PointLight(0x6f86ff, 40, 0, 2); l1.position.set(3, 3, 4);
const l2 = new THREE.PointLight(0xff8ad8, 26, 0, 2); l2.position.set(-3, -2, 3);
const l3 = new THREE.DirectionalLight(0xffffff, 1.4); l3.position.set(-2, 4, 6);
scene.add(l1, l2, l3);

const glass = (tint, dist = 1.4, extra = {}) => new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.08, transmission: 1, thickness: 0.6, ior: 1.4,
  attenuationColor: new THREE.Color(tint), attenuationDistance: dist,
  iridescence: 0.8, iridescenceIOR: 1.3, clearcoat: 1, clearcoatRoughness: 0.05,
  envMapIntensity: 1.2, ...extra,
});

/* Tinted glass: gradient body colour + partial transmission, so colour survives the matte */
function gradTex(stops, angle = 0.8) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  const lg = g.createLinearGradient(0, 256 * (1 - angle), 256, 256 * angle);
  stops.forEach((col, i) => lg.addColorStop(i / (stops.length - 1), col));
  g.fillStyle = lg; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const tinted = (stops, transmission = 0.5, extra = {}) => new THREE.MeshPhysicalMaterial({
  map: gradTex(stops), roughness: 0.12, transmission, thickness: 0.5, ior: 1.4,
  iridescence: 0.7, iridescenceIOR: 1.3, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.1,
  sheen: 0.4, sheenColor: new THREE.Color("#ffffff"), ...extra,
});

function textTexture(text, { size = 512, font = 800, colour = "#fff", px = 300 } = {}) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d");
  g.fillStyle = colour; g.font = `${font} ${px}px Inter`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, size / 2, size / 2 + px * 0.04);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
async function imageTexture(src) {
  const t = await new THREE.TextureLoader().loadAsync(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const plane = (w, h, map, extra = {}) =>
  new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map, transparent: true, toneMapped: false, ...extra }));

const root = new THREE.Group(); scene.add(root);

/* Three stacked glass tiles, back to front */
function tileStack(mats, { w = 1.9, h = 1.9, d = 0.24, gap = 0.5 } = {}) {
  const tints = mats;
  const tiles = mats.map((mat, i) => {
    const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 6, 0.34), mat);
    const k = tints.length - 1 - i;
    m.position.set(k * gap * 1.05, k * gap * 0.62, -k * gap * 0.9);
    root.add(m); return m;
  });
  return tiles[tiles.length - 1];
}

if (icon === "ai") {
  const front = tileStack([
    tinted(["#f1d9ff", "#d9c8ff"], 0.75),
    tinted(["#c9c8ff", "#b49bff"], 0.65),
    tinted(["#4f7bff", "#6a63f6", "#9f62f2"], 0.35),
  ]);
  const t = plane(1.5, 1.5, textTexture("AI", { px: 270, font: 700 }));
  t.position.set(0, 0, 0.13); front.add(t);
  root.rotation.set(-0.12, 0.42, 0.03); root.position.set(-0.4, -0.25, 0);
  cam.position.z = 10;
}

if (icon === "creative") {
  tileStack([tinted(["#ffd5ec", "#ffc7b4"], 0.7), tinted(["#1d1430", "#2a1d44"], 0.15)], { gap: 0.45 });
  const front = root.children[root.children.length - 1];
  front.position.set(-0.15, -0.1, 0.42);
  // Official app icon (from acestar.my) on the front glass tile
  const ps = plane(1.62, 1.58, await imageTexture("./assets/ps.png"));
  ps.position.set(0, 0, 0.13); front.add(ps);
  root.rotation.set(-0.12, 0.42, 0.03); root.position.set(-0.2, -0.1, 0);
  cam.position.z = 9.6;
}

if (icon === "doc") {
  const paper = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, transmission: 0.35, thickness: 0.1, clearcoat: 0.6, envMapIntensity: 0.9 });
  const lines = (() => { const c = document.createElement("canvas"); c.width = 512; c.height = 680; const g = c.getContext("2d");
    g.fillStyle = "#c9cfdf"; const bar = (x, y, w, hgt = 18) => { g.beginPath(); g.roundRect(x, y, w, hgt, 9); g.fill(); };
    bar(56, 70, 250, 28); for (let i = 0; i < 9; i++) bar(56, 150 + i * 46, i % 3 === 2 ? 260 : 400);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  [[0.5, 0.45, -0.6], [0.25, 0.22, -0.3], [0, 0, 0]].forEach(([x, y, z], i) => {
    const sheet = new THREE.Mesh(new RoundedBoxGeometry(1.75, 2.3, 0.05, 4, 0.06), paper);
    sheet.position.set(x, y, z); root.add(sheet);
    if (i === 2) { const p = plane(1.75, 2.3, lines, { opacity: 0.9 }); p.position.z = 0.03; sheet.add(p); }
  });
  // Official Acrobat Sign icon (from acestar.my) as a raised badge
  const badgeBase = new THREE.Mesh(new RoundedBoxGeometry(1.0, 1.0, 0.16, 6, 0.2), new THREE.MeshPhysicalMaterial({ color: 0x5b4ccc, roughness: 0.25, clearcoat: 1 }));
  badgeBase.position.set(0.72, -0.82, 0.32); root.add(badgeBase);
  const badge = plane(1.0, 0.975, await imageTexture("./assets/sign.png")); badge.position.z = 0.085; badgeBase.add(badge);
  root.rotation.set(-0.08, 0.38, 0.03); root.position.set(-0.15, 0.15, 0);
  cam.position.z = 10.2;
}

if (icon === "laptop") {
  const alu = new THREE.MeshPhysicalMaterial({ color: 0xdfe3ea, metalness: 1, roughness: 0.28, clearcoat: 0.4, envMapIntensity: 1.1 });
  const base = new THREE.Mesh(new RoundedBoxGeometry(3.2, 0.12, 2.15, 4, 0.05), alu); root.add(base);
  const deck = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 0.9), new THREE.MeshPhysicalMaterial({ color: 0x2a2e38, roughness: 0.6 }));
  deck.rotation.x = -Math.PI / 2; deck.position.set(0, 0.062, -0.38); root.add(deck); // keyboard well
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.62), new THREE.MeshPhysicalMaterial({ color: 0xcfd4dc, metalness: 0.9, roughness: 0.35 }));
  pad.rotation.x = -Math.PI / 2; pad.position.set(0, 0.062, 0.6); root.add(pad);
  const hinge = new THREE.Group(); hinge.position.set(0, 0.06, -1.07); root.add(hinge);
  const lid = new THREE.Mesh(new RoundedBoxGeometry(3.2, 2.1, 0.07, 4, 0.03), alu); lid.position.set(0, 1.05, 0); hinge.add(lid);
  const scr = (() => { const c = document.createElement("canvas"); c.width = 1024; c.height = 660; const g = c.getContext("2d");
    const lg = g.createLinearGradient(0, 0, 1024, 660); lg.addColorStop(0, "#1b2140"); lg.addColorStop(0.5, "#3a3f86"); lg.addColorStop(1, "#b17bd8");
    g.fillStyle = lg; g.fillRect(0, 0, 1024, 660);
    const rg = g.createRadialGradient(760, 180, 0, 760, 180, 520); rg.addColorStop(0, "rgba(255,255,255,0.35)"); rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 1024, 660);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.92), new THREE.MeshPhysicalMaterial({ map: scr, roughness: 0.05, clearcoat: 1, emissive: 0xffffff, emissiveMap: scr, emissiveIntensity: 0.55 }));
  screen.position.set(0, 1.05, 0.037); hinge.add(screen);
  hinge.rotation.x = -0.32;
  // Glass ribbon sweeping behind (same language as the hero)
  const pts = []; for (let i = 0; i <= 120; i++) { const t = i / 120; pts.push(new THREE.Vector3(-3.4 + t * 6.8, 0.2 + Math.sin(t * Math.PI * 1.2) * 0.9, -1.6 + Math.cos(t * Math.PI) * 0.5)); }
  const curve = new THREE.CatmullRomCurve3(pts);
  const ribbonGeo = (() => { const seg = 240, wv = 0.9, pos = [], idx = [];
    for (let i = 0; i <= seg; i++) { const t = i / seg, p = curve.getPointAt(t), tw = t * Math.PI * 0.9;
      const dir = new THREE.Vector3(0, Math.cos(tw), Math.sin(tw)).multiplyScalar(wv * (0.5 + 0.5 * Math.sin(t * Math.PI)));
      pos.push(p.x - dir.x / 2, p.y - dir.y / 2, p.z - dir.z / 2, p.x + dir.x / 2, p.y + dir.y / 2, p.z + dir.z / 2); }
    for (let i = 0; i < seg; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g; })();
  const ribbon = new THREE.Mesh(ribbonGeo, tinted(["#7aa2ff", "#a98bff", "#ffb3e2"], 0.45, { side: THREE.DoubleSide, thickness: 0.2 }));
  ribbon.position.set(0.4, 0.6, 0); root.add(ribbon);
  root.rotation.set(0.42, -0.55, 0); root.position.set(-0.15, -0.75, 0);
  cam.position.z = 11.2;
}

/* ---------- render twice + difference matte ---------- */
async function shot(bg) {
  scene.background = new THREE.Color(bg);
  renderer.render(scene, cam); renderer.render(scene, cam);
  const img = new Image(); img.src = renderer.domElement.toDataURL("image/png"); await img.decode();
  const c = document.createElement("canvas"); c.width = c.height = S; const g = c.getContext("2d"); g.drawImage(img, 0, 0);
  return g.getImageData(0, 0, S, S);
}
const B = await shot(0x000000), W = await shot(0xffffff);
const out = new ImageData(S, S);
for (let i = 0; i < out.data.length; i += 4) {
  const d = ((W.data[i] - B.data[i]) + (W.data[i + 1] - B.data[i + 1]) + (W.data[i + 2] - B.data[i + 2])) / 3;
  const a = Math.max(0, Math.min(255, 255 - d));
  out.data[i + 3] = a;
  for (let k = 0; k < 3; k++) out.data[i + k] = a > 0 ? Math.min(255, (B.data[i + k] * 255) / a) : 0;
}
const oc = document.createElement("canvas"); oc.width = oc.height = S; oc.getContext("2d").putImageData(out, 0, 0);
window.__png = oc.toDataURL("image/png");
window.__done = true;
</script></body></html>
