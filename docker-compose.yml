# Local PostgreSQL for development:  docker compose up -d
# Connection string (already in .env.example):  postgres://acestar:acestar@localhost:5432/acestar
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acestar
      POSTGRES_PASSWORD: acestar
      POSTGRES_DB: acestar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acestar -d acestar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
